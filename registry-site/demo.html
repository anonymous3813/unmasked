<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unmasked demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Oswald:wght@500;600;700&family=Yellowtail&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root{--bg:#F4F7E8;--card:#FCFDF6;--ink:#0F2A1E;--mute:#3F5546;--line:#C9D7B0;--acc:#0B5D3F;--accbg:#D3E5A8;--onacc:#FCFDF6;--hero:#0B5D3F;--onhero:#E3EFC3;--matcha2:#DCE9B8;--shadow:#0F2A1E;--head:#CFE3A0;--warn:#7A4F00;--warnbg:#F6E7B8;--bad:#A8391C;--badbg:#F6D9CF;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0C1A13;--card:#14281E;--ink:#EEF4E2;--mute:#A9BBA5;--line:#2C4536;--acc:#BFD98A;--accbg:#2B4D38;--onacc:#0C1A13;--hero:#123D2A;--onhero:#D3E5A8;--matcha2:#1A3325;--shadow:#050C08;--head:#2B4D38;--warn:#E3B04B;--warnbg:#3A2E12;--bad:#F08A63;--badbg:#3D1F14;color-scheme:dark}}
* { box-sizing: border-box; }
body { margin: 0; font: 17px/1.55 'Barlow', system-ui, sans-serif; color: var(--ink); background: var(--bg); }
:focus-visible { outline: 3px solid var(--acc); outline-offset: 3px; }
header { display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; padding: 16px 28px; background: var(--bg); border-bottom: 3px solid var(--ink); }
h1, h2, p { margin: 0; }
h1, h2 { font-family: 'Bowlby One', 'Oswald', Impact, sans-serif; font-weight: 400; line-height: 1.05; }
h1 { font-size: 28px; text-transform: uppercase; color: var(--acc); }
.navlink { margin-left: auto; color: var(--ink); font: 600 16px 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: .06em; text-decoration: underline; text-underline-offset: 4px; }
.badge { font: 600 15px/1.3 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: .08em; background: #C8E08C; color: #0C1A13; border: 2px solid #0C1A13; border-radius: 4px; padding: 4px 12px; transform: rotate(-2deg); }
main { display: grid; grid-template-columns: 1.4fr .8fr; gap: 28px; max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
section, aside { background: var(--card); color: var(--ink); border: 3px solid var(--ink); border-radius: 8px; padding: 22px; box-shadow: 6px 6px 0 var(--shadow); }
.product { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
.product h2 { font-size: clamp(22px, 3vw, 30px); text-transform: uppercase; margin-bottom: 6px; }
.price { font: 700 36px/1 'Oswald', sans-serif; color: var(--acc); }
.muted { color: var(--mute); font-size: 15px; margin-top: 4px; }
.tabs { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
.tabs button, .ask button, .choice, #monitor { font: 600 16px/1 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: .06em; cursor: pointer; border-radius: 6px; min-height: 44px; }
.tabs button, .choice { background: var(--card); color: var(--ink); border: 3px solid var(--ink); padding: 8px 16px; }
.tabs button[aria-pressed="true"] { background: var(--acc); color: var(--onacc); }
.ask button, #monitor { background: var(--acc); color: var(--onacc); border: 3px solid var(--ink); padding: 8px 18px; box-shadow: 4px 4px 0 var(--shadow); }
.card { border-top: 2px solid var(--line); padding: 14px 0; }
.card h2 { font-size: 16px; text-transform: none; }
.level { font: 600 13px/1.3 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--acc); margin: 4px 0; }
.high { color: var(--bad); }
blockquote { margin: 10px 0; padding: 6px 12px; border-left: 5px solid var(--acc); background: var(--accbg); }
.alt { display: grid; gap: 6px; padding: 14px 0; border-top: 2px solid var(--line); }
.alt.recommended { background: var(--accbg); margin: 0 -22px; padding: 14px 22px; }
.alt h2 { font-size: 16px; }
.thread { display: flex; flex-direction: column; gap: 10px; min-height: 180px; max-height: 320px; overflow-y: auto; margin-top: 12px; }
.you, .agent { margin: 0; max-width: 92%; padding: 8px 12px; border-radius: 8px; border: 2px solid var(--ink); }
.you { align-self: flex-end; background: var(--acc); color: var(--onacc); }
.agent { align-self: flex-start; background: var(--accbg); color: var(--ink); }
.ask { display: flex; gap: 8px; margin-top: 14px; }
.ask input { flex: 1; min-width: 0; font: 17px 'Barlow', sans-serif; border: 3px solid var(--ink); border-radius: 6px; padding: 10px 14px; background: var(--card); color: var(--ink); }
.choices { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.choice { text-align: left; font-size: 15px; line-height: 1.2; }
#monitor { margin-top: 16px; width: 100%; }
#status { margin-top: 12px; font-size: 15px; font-weight: 600; color: var(--acc); }
@media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Unmasked</h1>
      <p class="muted">Know what you're buying before you buy it.</p>
    </div>
    <a class="navlink" href="how-we-make-money.html">How we make money</a>
    <span class="badge">Demo data</span>
  </header>
  <main>
    <section>
      <div class="product">
        <div>
          <h2 id="name">Loading the demo report…</h2>
          <p class="muted" id="seller"></p>
          <p id="assessment"></p>
        </div>
        <p class="price" id="price"></p>
      </div>
      <p class="muted" id="label"></p>
      <div class="tabs" id="tabs"></div>
      <div id="panel"></div>
    </section>
    <aside>
      <h2>Unmasked AI</h2>
      <div class="thread" id="thread"></div>
      <div class="choices">
        <button type="button" class="choice" data-question="Which one would you recommend based on what I've returned before?">Which one fits what I've returned before?</button>
        <button type="button" class="choice" data-question="What's wrong with this product?">What's wrong with this product?</button>
      </div>
      <form class="ask" id="ask">
        <input name="question" type="text" placeholder="Ask about this demo" autocomplete="off">
        <button type="submit">Ask</button>
      </form>
      <button type="button" id="monitor">Notify me if the return policy changes</button>
      <p id="status"></p>
    </aside>
  </main>
  <script>
    const tabs = ["Overview", "Fine print", "Claims", "Reviews", "Sustainability", "Value", "Alternatives"];
    let report = null;
    let current = "Overview";

    function money(value) {
      return "$" + Number(value).toFixed(2);
    }

    function card(title, body, level) {
      const block = document.createElement("article");
      block.className = "card";
      const heading = document.createElement("h2");
      heading.textContent = title;
      const kind = document.createElement("p");
      kind.className = "level";
      kind.textContent = level || "";
      const copy = document.createElement("p");
      copy.textContent = body;
      block.append(heading, kind, copy);
      return block;
    }

    function render() {
      document.getElementById("name").textContent = report.product.name;
      document.getElementById("seller").textContent = report.product.brand + " · " + report.product.seller;
      document.getElementById("assessment").textContent = report.assessment;
      document.getElementById("price").textContent = money(report.product.price);
      document.getElementById("label").textContent = report.label;
      const panel = document.getElementById("panel");
      panel.replaceChildren();
      if (current === "Overview") {
        report.concerns.forEach((item) => panel.append(finding(item)));
        panel.append(card("Coverage", report.coverage, "what this demo includes"));
      } else if (current === "Fine print") {
        report.concerns.forEach((item) => panel.append(finding(item)));
      } else if (current === "Claims") {
        const claim = report.claim;
        const block = card(claim.text, claim.verdict + ". " + claim.explanation, claim.evidenceLevel);
        const quote = document.createElement("blockquote");
        quote.textContent = claim.quotation;
        block.append(quote);
        panel.append(block);
      } else if (current === "Reviews") {
        const review = report.review;
        panel.append(card(review.category, review.reports + " fixture reviews. " + review.excerpt + " " + review.limitation, review.evidenceLevel));
      } else if (current === "Sustainability") {
        const item = report.environment;
        panel.append(card("Environmental finding", item.finding, item.evidenceLevel));
      } else if (current === "Value") {
        panel.append(card("Price", report.value.finding, report.value.evidenceLevel));
      } else {
        report.alternatives.forEach((item) => {
          const block = document.createElement("article");
          block.className = "alt" + (item.recommended ? " recommended" : "");
          const title = document.createElement("h2");
          title.textContent = item.name + " · " + money(item.price);
          const why = document.createElement("p");
          why.textContent = item.why + " Addresses: " + item.addresses;
          const tradeoff = document.createElement("p");
          tradeoff.className = "muted";
          tradeoff.textContent = item.tradeoff;
          block.append(title, why, tradeoff);
          panel.append(block);
        });
      }
    }

    function finding(item) {
      const block = card(item.category, item.explanation + " " + item.action, item.evidenceLevel + " · " + item.severity);
      const quote = document.createElement("blockquote");
      quote.textContent = item.quotation;
      block.append(quote);
      return block;
    }

    function say(role, text) {
      const line = document.createElement("p");
      line.className = role === "you" ? "you" : "agent";
      line.textContent = text;
      const thread = document.getElementById("thread");
      thread.append(line);
      thread.scrollTop = thread.scrollHeight;
    }

    async function ask(question) {
      say("you", question);
      const response = await fetch("/demo/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const payload = await response.json();
      say("agent", payload.answer);
    }

    document.getElementById("tabs").append(...tabs.map((name) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = name;
      button.setAttribute("aria-pressed", name === current ? "true" : "false");
      button.addEventListener("click", () => {
        current = name;
        document.querySelectorAll(".tabs button").forEach((item) => item.setAttribute("aria-pressed", item === button ? "true" : "false"));
        render();
      });
      return button;
    }));

    document.getElementById("ask").addEventListener("submit", (event) => {
      event.preventDefault();
      const input = event.target.elements.question;
      const question = input.value.trim();
      if (!question) return;
      input.value = "";
      ask(question);
    });
    document.querySelectorAll(".choice").forEach((button) => {
      button.addEventListener("click", () => ask(button.dataset.question));
    });
    document.getElementById("monitor").addEventListener("click", async () => {
      const response = await fetch("/demo/monitors", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ product: report.product.name }),
      });
      const payload = await response.json();
      document.getElementById("status").textContent = payload.message;
    });

    fetch("/demo/report")
      .then((response) => response.json())
      .then((payload) => {
        report = payload;
        render();
        say("agent", "This is the Harbor Headphones demo. Ask which model fits what you returned before.");
      })
      .catch(() => {
        document.getElementById("name").textContent = "The demo report did not load.";
      });
  </script>
</body>
</html>
